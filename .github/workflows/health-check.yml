name: Daily health check

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run health check
        run: node scripts/health-check.js

      - name: Commit updated status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/apis.json data/history.json
          if git diff --cached --quiet; then
            echo "No status changes to publish."
            exit 0
          fi
          git commit -m "chore: daily health check [skip ci]"
          # master is PR-protected, so publish the data to a dedicated
          # unprotected branch instead. Force-push keeps it as a mirror of
          # the latest run (the default GITHUB_TOKEN can write here).
          git push --force origin HEAD:health-status
